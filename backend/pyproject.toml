[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "life-agent-backend"
version = "0.2.0"
description = "Local-first personal Life Agent backend (FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlmodel>=0.0.16",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]
# Real integrations for the Backend Mac (mail.com IMAP/SMTP is stdlib; iCloud needs caldav).
integrations = [
    "caldav>=1.3",
    "icalendar>=5.0",
]
# Document understanding (email attachments: PDF / Word / images).
documents = [
    "pypdf>=4.0",
    "python-docx>=1.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# B008: FastAPI Depends() in defaults is idiomatic.
# UP042: str+Enum is a deliberate SQLModel/pydantic-compatible pattern.
ignore = ["B008", "UP042"]
